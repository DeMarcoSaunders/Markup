name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
        sudo apt-get install -y libasound2-dev mesa-common-dev libx11-dev libxrandr-dev libxi-dev xorg-dev libgl1-mesa-dev libglu1-mesa-dev

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake

    - name: Setup MSVC (Windows)
      if: matrix.os == 'windows-latest'
      uses: microsoft/setup-msbuild@v1.1

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: |
        cmake --build build --config ${{ matrix.build_type }}

    - name: Test build artifacts
      shell: bash
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          ls -la build/${{ matrix.build_type }}/
          test -f build/${{ matrix.build_type }}/showcase.exe
          test -f build/${{ matrix.build_type }}/demo.exe
        else
          ls -la build/
          test -f build/showcase
          test -f build/demo
        fi

  documentation:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check documentation
      run: |
        # Check that key documentation files exist
        test -f README.md
        test -f LICENSE
        test -f CONTRIBUTING.md
        test -f docs/components.md
        test -f fonts/README.md
        
        # Check that README has required sections
        grep -q "Quick Start" README.md
        grep -q "Features" README.md
        grep -q "Font System" README.md
        
        echo "Documentation check passed!"

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check code formatting
      run: |
        # Basic checks for code quality
        echo "Checking for common issues..."
        
        # Check for trailing whitespace
        if grep -r "[ \t]$" --include="*.c" --include="*.h" .; then
          echo "Found trailing whitespace"
          exit 1
        fi
        
        # Check for tabs (should use spaces)
        if grep -r $'\t' --include="*.c" --include="*.h" .; then
          echo "Found tabs instead of spaces"
          exit 1
        fi
        
        echo "Code quality check passed!"