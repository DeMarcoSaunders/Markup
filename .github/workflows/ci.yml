name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GL deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev xorg-dev

      - name: Configure (minimal link)
        run: cmake -S . -B build -DMARKUP_FETCH_RAYLIB=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Configure (optional modules)
        run: cmake -S . -B build_full -DMARKUP_FETCH_RAYLIB=ON -DMARKUP_WITH_BLUR=ON -DMARKUP_WITH_STYLE_FILE=ON -DMARKUP_WITH_EXTRA_WIDGETS=ON

      - name: Build full preset
        run: cmake --build build_full --config Release
